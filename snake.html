<!doctype html>
<html>
  <head>
    <script src="https://pixijs.download/release/pixi.min.js"></script>
  </head>
  <body>
    <script type="module">
      // Set canvas size to 90% of the window inner height and equal width
      const canvasSize = Math.floor(window.innerHeight * 0.9);

      // Create the application helper and add its render target to the page
      const app = new PIXI.Application();
      await app.init({ width: canvasSize, height: canvasSize, backgroundColor: 0x1099bb });
      document.body.appendChild(app.canvas);

      //---- Snake game implementation ----

      // Configuration
      const tileSize = 20;
      const gridSize = app.view.width / tileSize; // assumes square grid
      const moveInterval = 0.05; // seconds per move

      // Game state
      let gameOver = false;
      let gameOverText = null;

      // Initialize snake: start with one segment at center
      let snake = [{ x: Math.floor(gridSize/2), y: Math.floor(gridSize/2) }];
      // Initial direction: moving right
      let snakeDir = { x: 1, y: 0 };

      // Create 10 food units randomly placed on the grid
      let food = [];
      for (let i = 0; i < 10; i++) {
        food.push({
          x: Math.floor(Math.random() * gridSize),
          y: Math.floor(Math.random() * gridSize)
        });
      }

      // Create a PIXI.Graphics object for drawing
      const graphics = new PIXI.Graphics();
      app.stage.addChild(graphics);

      // Restart game when game over and 'S' is pressed
      function resetGame() {
        if (gameOverText) {
          app.stage.removeChild(gameOverText);
          gameOverText.destroy();
          gameOverText = null;
        }
        // Reset state
        snake = [{ x: Math.floor(gridSize/2), y: Math.floor(gridSize/2) }];
        snakeDir = { x: 1, y: 0 };
        food = [];
        for (let i = 0; i < 10; i++) {
          food.push({
            x: Math.floor(Math.random() * gridSize),
            y: Math.floor(Math.random() * gridSize)
          });
        }
        gameOver = false;
        app.ticker.start();
      }

      // Listen for keyboard input to change snake direction and restart game
      document.addEventListener('keydown', (e) => {
        if (gameOver && (e.key === 's' || e.key === 'S')) {
          resetGame();
          return;
        }
        if (e.key === 'ArrowUp' && snakeDir.y !== 1) {
          snakeDir = { x: 0, y: -1 };
        } else if (e.key === 'ArrowDown' && snakeDir.y !== -1) {
          snakeDir = { x: 0, y: 1 };
        } else if (e.key === 'ArrowLeft' && snakeDir.x !== 1) {
          snakeDir = { x: -1, y: 0 };
        } else if (e.key === 'ArrowRight' && snakeDir.x !== -1) {
          snakeDir = { x: 1, y: 0 };
        }
      });

      // Update the snake's position and check for collisions
      function updateSnake() {
        // Calculate new head position
        let head = {
          x: snake[0].x + snakeDir.x,
          y: snake[0].y + snakeDir.y
        };

        // Check border collision - game over if head is outside grid
        if (head.x < 0 || head.x >= gridSize || head.y < 0 || head.y >= gridSize) {
          return endGame();
        }

        // Check self-collision: if head collides with any segment of the snake
        for (let segment of snake) {
          if (head.x === segment.x && head.y === segment.y) {
            return endGame();
          }
        }

        // Add new head to the snake
        snake.unshift(head);

        // Check if any food is eaten; if so, replace eaten food with a new food piece
        let foodEaten = false;
        for (let i = food.length - 1; i >= 0; i--) {
          if (head.x === food[i].x && head.y === food[i].y) {
            food.splice(i, 1);
            food.push({
              x: Math.floor(Math.random() * gridSize),
              y: Math.floor(Math.random() * gridSize)
            });
            foodEaten = true;
          }
        }

        // If no food was eaten, remove the tail segment
        if (!foodEaten) {
          snake.pop();
        }
      }

      function showGameOverScreen() {
        const style = new PIXI.TextStyle({
          fill: "white",
          fontSize: 48,
          align: "center"
        });
        gameOverText = new PIXI.Text("Game Over!\nPress S to restart", style);
        gameOverText.anchor.set(0.5);
        gameOverText.x = app.view.width / 2;
        gameOverText.y = app.view.height / 2;
        app.stage.addChild(gameOverText);
      }

      function endGame() {
        gameOver = true;
        app.ticker.stop();
        showGameOverScreen();
      }

      // Draw snake using circles; head with eyes, body segments plain
      function drawSnake() {
        // Head
        let head = snake[0];
        let centerX = head.x * tileSize + tileSize / 2;
        let centerY = head.y * tileSize + tileSize / 2;
        graphics.beginFill(0x00AA00);
        graphics.drawCircle(centerX, centerY, tileSize / 2);
        graphics.endFill();

        // Eyes on head
        graphics.beginFill(0xFFFFFF);
        let eyeOffsetX = tileSize / 6;
        let eyeOffsetY = tileSize / 6;
        graphics.drawCircle(centerX - eyeOffsetX, centerY - eyeOffsetY, tileSize / 10);
        graphics.drawCircle(centerX + eyeOffsetX, centerY - eyeOffsetY, tileSize / 10);
        graphics.endFill();

        // Body segments
        graphics.beginFill(0x00FF00);
        for (let i = 1; i < snake.length; i++) {
          let segment = snake[i];
          let segCenterX = segment.x * tileSize + tileSize / 2;
          let segCenterY = segment.y * tileSize + tileSize / 2;
          graphics.drawCircle(segCenterX, segCenterY, tileSize / 2 - 1);
        }
        graphics.endFill();
      }

      // Draw food as a "mouse": a grey circle with two smaller ears
      function drawFood() {
        food.forEach(piece => {
          let centerX = piece.x * tileSize + tileSize / 2;
          let centerY = piece.y * tileSize + tileSize / 2;
          // Body of the mouse
          graphics.beginFill(0xAAAAAA);
          graphics.drawCircle(centerX, centerY, tileSize / 2 - 1);
          graphics.endFill();
          // Ears
          graphics.beginFill(0xCCCCCC);
          graphics.drawCircle(centerX - tileSize / 4, centerY - tileSize / 2, tileSize / 6);
          graphics.drawCircle(centerX + tileSize / 4, centerY - tileSize / 2, tileSize / 6);
          graphics.endFill();
        });
      }

      // Render the game
      function drawGame() {
        graphics.clear();
        drawSnake();
        drawFood();
      }

      // Game loop update using PIXI ticker
      let deltaAccumulator = 0;
      app.ticker.add((ticker) => {
        if (gameOver) return;
        const deltaSeconds = ticker.deltaTime / ticker.FPS;
        deltaAccumulator += deltaSeconds;
        if (deltaAccumulator >= moveInterval) {
          updateSnake();
          drawGame();
          deltaAccumulator = 0;
        }
      });
    </script>
  </body>
</html>
